<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일반 RAG vs Baton</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --ink: #1d1f23; --muted: #6b6f76; --line: #e3e3df;
  --base: #9aa0a8; --base-soft: #eceef0; --baton: #2f6fec; --baton-soft: #e6eefd;
  --good: #1f8a4c; --good-soft: #e3f4ea; --bad: #c4372f; --bad-soft: #fbe7e5; --warn: #a86a00; --warn-soft: #fdf1da;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2024; --ink: #e8e9eb; --muted: #9a9ea6; --line: #2e3238;
    --base: #7d838c; --base-soft: #2a2e33; --baton: #6b9bff; --baton-soft: #1f2b44;
    --good: #4cc483; --good-soft: #17301f; --bad: #ff7b72; --bad-soft: #3a1d1b; --warn: #e3a83c; --warn-soft: #362a12;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --ink: #e8e9eb; --muted: #9a9ea6; --line: #2e3238;
  --base: #7d838c; --base-soft: #2a2e33; --baton: #6b9bff; --baton-soft: #1f2b44;
  --good: #4cc483; --good-soft: #17301f; --bad: #ff7b72; --bad-soft: #3a1d1b; --warn: #e3a83c; --warn-soft: #362a12;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
h2 { font-size: 19px; margin: 40px 0 12px; }
.sub { color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin: 16px 0 0; flex-wrap: wrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.headline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.kpi .name { color: var(--muted); font-size: 13px; }
.kpi .pair { display: flex; align-items: baseline; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
.kpi .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .v.base { color: var(--base); font-size: 20px; font-weight: 600; }
.kpi .v.baton { color: var(--baton); }
.kpi .note { font-size: 12px; color: var(--muted); margin-top: 4px; }

.cat { display: grid; grid-template-columns: 170px 1fr 90px; gap: 16px; align-items: center;
  padding: 14px 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
.cat:hover, .cat.on { background: var(--baton-soft); }
.cat:last-child { border-bottom: 0; }
.cat .label { font-weight: 600; }
.cat .label small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.bars { display: grid; gap: 6px; }
.barrow { display: grid; grid-template-columns: 1fr 150px; gap: 10px; align-items: center; }
.barrow .num { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { position: relative; height: 18px; background: var(--base-soft); border-radius: 4px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.bar .ci { position: absolute; top: 50%; height: 2px; background: var(--ink); opacity: .45; }
.bar .ci::before, .bar .ci::after { content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: var(--ink); }
.bar .ci::before { left: 0; } .bar .ci::after { right: 0; }
.sig { font-size: 12px; color: var(--muted); text-align: right; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
td.win { font-weight: 700; }
td.src { color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; }

#cases .q { margin-bottom: 18px; }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qhead .qid { color: var(--muted); font-size: 12px; }
.qtext { font-weight: 600; font-size: 16px; }
.gold { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }
.pair2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--bg); min-width: 0; }
.ans.baton { border-color: var(--baton); }
.ans .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.ans .who { font-weight: 700; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.b-correct { background: var(--good-soft); color: var(--good); }
.b-partial { background: var(--warn-soft); color: var(--warn); }
.b-wrong { background: var(--bad-soft); color: var(--bad); }
.b-abstain, .b-error { background: var(--base-soft); color: var(--muted); }
.ans .body { font-size: 14px; overflow-wrap: anywhere; }
mark.good { background: var(--good-soft); color: var(--good); border-radius: 3px; padding: 0 2px; }
mark.bad { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 2px; }
.meta { font-size: 12px; color: var(--muted); margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.meta ul { margin: 4px 0 0; padding-left: 18px; }
.meta li.hit { color: var(--good); }
.flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.flag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); }
details summary { cursor: pointer; }
.method p, .method li { color: var(--ink); }
.method ol { padding-left: 20px; }
.empty { color: var(--muted); }
@media (max-width: 720px) {
  .headline { grid-template-columns: 1fr; }
  .cat { grid-template-columns: 1fr; gap: 6px; }
  .sig { text-align: left; }
  .pair2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <h1>일반 RAG vs Baton</h1>
  <p class="sub" id="sub"></p>
  <div class="legend">
    <span><span class="dot" style="background:var(--base)"></span>일반 RAG (EnterpriseRAG-Bench 논문의 벡터 기준 시스템)</span>
    <span><span class="dot" style="background:var(--baton)"></span>Baton</span>
    <span>막대 끝 선 = 95% 신뢰구간 (Wilson)</span>
  </div>

  <div class="headline" id="headline"></div>

  <h2>범주별 정답률 <span class="sub" style="font-size:13px;font-weight:400">— 줄을 누르면 아래에 문항별 두 답이 나옵니다</span></h2>
  <div class="card" id="scorecard"></div>

  <h2>지표 전체</h2>
  <div class="card scroll"><table id="metrics"></table></div>

  <h2 id="cases-title">문항별 두 답</h2>
  <div id="cases"></div>

  <h2>어떻게 쟀나</h2>
  <div class="card method" id="method"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const S = Object.keys(DATA.systems);
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (v) => v == null ? "—" : (v * 100).toFixed(0) + "%";
const fmt = (v, kind) => {
  if (v == null) return "—";
  if (kind === "pct") return pct(v);
  if (kind === "pct100") return v.toFixed(0) + "%";
  if (kind === "signed") return (v >= 0 ? "+" : "") + v.toFixed(2);
  if (kind === "ms") return (v / 1000).toFixed(1) + "초";
  return v.toFixed(2);
};
const VERDICT = { correct: "맞음", partial: "부분", wrong: "틀림", abstain: "답 못함", error: "채점 실패" };
const card = DATA.card, meta = card.meta;

$("sub").textContent = `문서 ${meta.docs}건 (시드 ${meta.seed_docs} + 결함을 심은 문서 ${meta.bench_docs}) · 문항 ${meta.questions}개 · ` +
  `같은 말뭉치 · 같은 임베딩 · 같은 답변 모델 · 자동 채점 · ${meta.generated_at} · 말뭉치 지문 ${meta.fingerprint}`;

// 첫 줄 숫자 세 개
const o = card.overall;
const kpis = [
  ["전체 정답률", "accuracy", "pct", `McNemar p = ${card.overall_mcnemar.p.toFixed(3)} (Baton만 맞힘 ${card.overall_mcnemar.only_b} · 일반 RAG만 맞힘 ${card.overall_mcnemar.only_a})`],
  ["틀린 답 비율 (환각)", "hallucination", "pct", "그럴듯하게 틀린 답 — 낮을수록 좋음"],
  ["진실성 점수", "truthfulness", "signed", "CRAG: 맞음 +1 · 답 못함 0 · 틀림 −1"],
];
$("headline").innerHTML = kpis.map(([name, key, kind, note]) => `
  <div class="card kpi"><div class="name">${name}</div>
    <div class="pair"><span class="v baton">${fmt(o.baton[key], kind)}</span>
    <span class="v base">${fmt(o.baseline[key], kind)}</span></div>
    <div class="note">파랑 Baton · 회색 일반 RAG<br>${esc(note)}</div></div>`).join("");

// 성적표
function bar(sys, s) {
  const color = sys === "baton" ? "var(--baton)" : "var(--base)";
  const acc = s.accuracy ?? 0;
  return `<div class="barrow"><div class="bar" title="95% 신뢰구간 ${pct(s.ci[0])}~${pct(s.ci[1])}">
    <div class="fill" style="width:${acc * 100}%;background:${color}"></div>
    <div class="ci" style="left:${s.ci[0] * 100}%;width:${(s.ci[1] - s.ci[0]) * 100}%"></div></div>
    <span class="num">${DATA.systems[sys]} ${pct(s.accuracy)} (${s.correct}/${s.n})</span></div>`;
}
$("scorecard").innerHTML = card.categories.map((c) => `
  <div class="cat" data-cat="${c.key}">
    <div class="label">${esc(c.label)}<small>${c.systems.baton.n}문항</small></div>
    <div class="bars">${S.map((s) => bar(s, c.systems[s])).join("")}</div>
    <div class="sig">${c.mcnemar.p < 0.05 ? "<b>유의함</b>" : "차이 작음"}<br>p = ${c.mcnemar.p.toFixed(3)}</div>
  </div>`).join("");
document.querySelectorAll(".cat").forEach((el) => el.addEventListener("click", () => showCases(el.dataset.cat)));

// 지표 표
$("metrics").innerHTML = `<tr><th>지표</th>${S.map((s) => `<th style="text-align:right">${DATA.systems[s]}</th>`).join("")}<th>근거</th></tr>` +
  DATA.metrics.map(([key, name, kind, higher, src]) => {
    const vals = S.map((s) => o[s][key]);
    const ok = vals.every((v) => v != null);
    const best = ok && vals[0] !== vals[1] ? (higher ? Math.max(...vals) : Math.min(...vals)) : null;
    return `<tr><td>${esc(name)}</td>${vals.map((v) => `<td class="n ${v === best ? "win" : ""}">${fmt(v, kind)}</td>`).join("")}<td class="src">${esc(src)}</td></tr>`;
  }).join("");

// 사례
function mark(text, expect) {
  let html = esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
  if (!expect) return html;
  const good = [expect.latest, expect.value, ...(expect.both || [])].filter(Boolean);
  const bad = [expect.outdated].filter(Boolean);
  for (const [list, cls] of [[good, "good"], [bad, "bad"]]) {
    for (const v of list) html = html.split(esc(v)).join(`<mark class="${cls}">${esc(v)}</mark>`);
  }
  return html;
}
function answerBox(sys, a, expect) {
  const flags = [];
  if (sys === "baton") {
    if (a.superseded) flags.push(`대체된 근거 ${a.superseded}건 표시`);
    if (a.confirmed) flags.push(`사람이 확인한 근거 ${a.confirmed}건`);
    if (a.no_evidence) flags.push("근거 없음으로 답 보류");
  }
  const votes = Object.entries(a.votes || {}).map(([k, v]) => `${k} ${VERDICT[v] || v}`).join(" · ");
  const docs = a.docs.length
    ? `<ul>${a.docs.map((d) => `<li class="${d.expected ? "hit" : ""}">${d.expected ? "정답 문서 · " : ""}${esc(d.title)}</li>`).join("")}</ul>`
    : " 없음";
  return `<div class="ans ${sys}">
    <div class="top"><span class="who">${DATA.systems[sys]}</span><span class="badge b-${a.verdict}">${VERDICT[a.verdict] || a.verdict}</span></div>
    <div class="body">${mark(a.answer, expect) || '<span class="empty">(빈 답)</span>'}</div>
    ${flags.length ? `<div class="flags">${flags.map((f) => `<span class="flag">${esc(f)}</span>`).join("")}</div>` : ""}
    <div class="meta">채점 이유: ${esc(a.reason)}<br>심판: ${esc(votes)}${a.latency ? ` · 응답 ${(a.latency / 1000).toFixed(1)}초` : ""}
      <details><summary>본 문서 ${a.docs.length}건${a.ndcg != null ? ` · nDCG@10 ${a.ndcg.toFixed(2)}` : ""}</summary>${docs}</details></div>
  </div>`;
}
function showCases(cat) {
  document.querySelectorAll(".cat").forEach((el) => el.classList.toggle("on", el.dataset.cat === cat));
  const list = DATA.cases.filter((c) => c.category === cat);
  // 두 시스템의 판정이 갈린 문항을 먼저 보여 준다
  const rank = (c) => (c.systems.baton.verdict === c.systems.baseline.verdict ? 1 : 0);
  list.sort((a, b) => rank(a) - rank(b));
  $("cases-title").textContent = `문항별 두 답 · ${DATA.categories[cat]} (${list.length}문항, 판정이 갈린 것부터)`;
  $("cases").innerHTML = list.map((c) => `
    <div class="card q">
      <div class="qhead"><span class="qtext">${esc(c.question)}</span><span class="qid">${esc(c.id)}</span></div>
      <div class="gold">정답 기준: ${esc(c.gold)}</div>
      <div class="pair2">${S.map((s) => answerBox(s, c.systems[s], c.expect)).join("")}</div>
    </div>`).join("");
  $("cases-title").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("cases").innerHTML = '<p class="empty">위 성적표에서 범주 줄을 누르세요.</p>';

// 방법
const kappa = S.map((s) => `${DATA.systems[s]} ${card.judge_kappa[s] == null ? "—" : card.judge_kappa[s].toFixed(2)}`).join(" · ");
$("method").innerHTML = `
<p>사람이 채점하지 않았습니다. 같은 문항을 세 겹으로 자동 채점했습니다.</p>
<ol>
  <li><b>규칙 검사</b> — 결함을 심은 문항은 정답 값을 미리 압니다. 답에 그 값이 글자로 들어 있는지만 봅니다. 모델을 쓰지 않아 누가 돌려도 같은 결과가 나옵니다.</li>
  <li><b>심판</b> — DeepSeek v4 Pro(온도 0) 한 번이 범주별 기준표로 맞음 · 부분 · 틀림 · 답 못함을 고릅니다.
    답변 모델과 같은 계열이라 자기 답을 편애할 수 있습니다. 다만 두 시스템 모두 DeepSeek로 답하므로 한쪽만 편드는 치우침은 아닙니다.</li>
  <li><b>논문 채점기</b> — EnterpriseRAG-Bench의 metrics_based_eval을 그대로 돌려 정답 여부 · 정답 사실 포함률 · 쓸데없는 문서 수를 냅니다. 정답 문서 재보정은 끕니다.</li>
</ol>
<p>범주별 기준은 CONFLICTS(Cattan 외, 2025)의 기대 행동을 따릅니다. 값이 바뀐 경우는 최신 값을, 문서끼리 엇갈리는 경우는 두 값과 엇갈림을, 오래된 기록은 값과 함께 확인 필요를, 답이 없는 질문은 없다고 말해야 맞습니다.</p>
<p>공정성 — 두 시스템은 같은 문서 ${meta.docs}건, 같은 임베딩(Cohere embed-multilingual-v3), 같은 답변 모델(DeepSeek)을 씁니다.
일반 RAG는 EnterpriseRAG-Bench 논문의 벡터 기준 시스템(512토큰 조각 · 상위 10개 문서 전문 · 논문 프롬프트)을 그대로 옮기고 임베딩과 답변 모델만 맞췄습니다.</p>
<p>한계 — 문항 수가 범주마다 10~25개라 신뢰구간이 넓습니다. 심판과 사람의 일치도는 이번에 재지 않았습니다(문헌값으로 갈음). 결함 문서는 우리가 만든 합성 데이터입니다.</p>
<details><summary>참고 문헌</summary><ul>
  <li>EnterpriseRAG-Bench — Onyx, arXiv 2605.05253 (2026)</li>
  <li>CONFLICTS — Cattan 외, "DRAGged into Conflicts", 2025</li>
  <li>CRAG — Yang 외, "Comprehensive RAG Benchmark", NeurIPS 2024</li>
  <li>RAGAS — Es 외, EACL 2024 (faithfulness · context precision / recall)</li>
  <li>ALCE — Gao 외, "Enabling LLMs to Generate Text with Citations", EMNLP 2023</li>
  <li>MT-Bench / LLM-as-a-judge — Zheng 외, NeurIPS 2023</li>
  <li>nDCG — Järvelin &amp; Kekäläinen, TOIS 2002 · BEIR — Thakur 외, 2021</li>
  <li>Wilson 1927 (비율 신뢰구간) · McNemar 1947 (짝지은 비교)</li>
</ul></details>`;
</script>
</body>
</html>
